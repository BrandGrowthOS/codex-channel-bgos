name: Publish to npm

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Detect version change
        id: ver
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "none")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREV" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          # Versions that must NOT be advertised as latest on npm. A version
          # lands in this list when its own source needs a backend that is not
          # deployed yet, so an install of latest would reach hosts too early.
          # 0.10.1: the daemon offers APPROVAL_HOLD_SECONDS (1800 s) and relies
          # on the BGOS backend clamping it to the owner's per agent choice.
          # Read the RELEASE ORDER comment above APPROVAL_HOLD_SECONDS in
          # src/interactions.ts. Against a backend without that column, that
          # clamp and its migration, every Codex approval becomes a thirty
          # minute card for every owner with no setting anywhere to shorten it.
          # This list is checked against the HELD-FROM-LATEST: <version> lines
          # in src/interactions.ts, which are the source side of the same hold
          # (test/publish-workflow.spec.ts). The two are edited together.
          # Once that backend is live, drop the version from this list AND its
          # HELD-FROM-LATEST line, then promote the already published package
          # by hand:
          #   npm dist-tag add codex-channel-bgos@<version> latest
          # 0.11.0: the plan card. The app has to know the `plan_card`
          # renderable, relabel the three `plan:` chip codes and read a chat's
          # session mode off a column that ships with the stage 3 backend. It
          # also inherits 0.10.1's approval hold. Held for both.
          # 0.12.0: the file change card's `approvalMeta.change_summary` and
          # `approvalMeta.diff`. The backend's ApprovalMetaDto strips a field
          # it does not declare, silently, with a 201, so against a backend
          # without the stage 4 DTO this daemon masks and caps a patch for
          # nothing and the card still reads "Apply file changes". It also
          # inherits both holds above. Held for all three.
          # 0.13.0: the request card's `approvalMeta.reason` and
          # `approvalMeta.rule_text`. Same mechanism as 0.12.0 and a WORSE
          # cost: against a backend without the stage 5 DTO both are stripped
          # with a 201 and no error, and the justification that was the card's
          # TITLE on 0.12.0 (`text` was `params.reason`) has moved into that
          # stripped `reason` while the title became `Run <command>`. So this
          # release says LESS than the one before it, not the same: the
          # sentence the owner used to read is gone and nothing replaces it,
          # and the permanent, global rule an Always answer would write is
          # still unsaid. It inherits all three holds above. Held for all four.
          # 0.14.0: adds no hold of its own. A picture Codex makes posts
          # itself as an ordinary image message, which every backend already
          # accepts. It is held only because it carries the holds of the
          # releases before it, so it is promoted only after 0.13.0 is on
          # latest, never before or in the same step: npm dist-tag add points
          # latest at whichever version ran last, so promoting an older
          # version after 0.14.0 moves latest back to that older version.
          # Beside that it waits for one thing no backend
          # gives: it is promoted only after one logged in live image turn
          # confirms the real item (result bytes and their form, the result
          # size (under 12 MiB, the line cap), revisedPrompt, savedPath, the
          # failure shape; probe.md, decision 7). The offline probe never saw
          # a real item, and a shape the code does not read turns every
          # picture into a "could not be shown" line while the served canon
          # tells the model not to resend it. A picture over the line cap
          # never posts either: its line is too large to read, and only that
          # "could not be shown" line reaches the chat.
          # 0.15.0: adds no hold of its own either. A steer with nothing to
          # steer runs as an ordinary message and a landed steer posts no
          # reply, which every backend already accepts (P5 stage 5, the steer
          # fallback, stacked on 0.14.0). It is held only because it carries
          # the holds of the releases before it, 0.14.0's included, so it is
          # promoted only after 0.14.0 is on latest, never before or in the
          # same step: npm dist-tag add points latest at whichever version ran
          # last, so promoting an older version after 0.15.0 moves latest back
          # to that older version. The HOAI app steers only daemons at 0.15.0
          # or later, so until it is promoted Send now on a Codex agent is a
          # plain send.
          # 0.18.0: adds no hold of its own either. It reports each chat's
          # model and effort to HOAI and declares session_model_control, and
          # an older backend answers the new report route with a 404 the
          # daemon swallows and stores the token without reading it (P5
          # stage 7, the model and effort row, stacked on 0.15.0; 0.16.0 and
          # 0.17.0 are P6's and P7's releases, #20 and #21, which merged
          # ahead of it). It is held only because it carries the holds of the
          # releases before it, 0.14.0's and 0.15.0's included, so it is
          # promoted only after 0.15.0 is on latest, never before or in the
          # same step: npm dist-tag add points latest at whichever version ran
          # last, so promoting an older version after 0.18.0 moves latest back
          # to that older version. The HOAI app offers the model and effort
          # row only to a daemon that declares session_model_control, so until
          # it is promoted no Codex agent shows the row.
          # 0.13.0 is P2 stage 5's release, which merged first and brought its
          # own line here (the entry above); merge order #12, #14, #15, P2
          # stage 5 (0.13.0), then 0.14.0, then 0.15.0, then 0.18.0. Held for
          # all seven.
          # 0.19.0: adds a hold of its own (mission 104, keep agents running).
          # It is the first Codex release to report latestKnownVersion and
          # updateReadiness on its heartbeat. The backend judges every
          # pairing's update state against ONE published version, the Claude
          # Code plugin's marketplace pin, so a Codex pairing reads
          # update_available whatever it runs, and the app trusts that
          # verdict once a pairing reports latest_known_version. The app also
          # offers its one click Update to any pairing whose readiness names
          # a supervisor, and that sends update_rpc, which this daemon does
          # not answer: it updates itself, from its supervisor. Against that
          # backend and app every 0.19.0 agent shows a false Update badge and
          # a one click Update that ends in "the agent host did not respond".
          # It is promoted only once the backend judges Codex pairings by
          # their own version (the npm latest they report, not the Claude
          # Code pin) and the app keeps Codex agents out of the one click
          # update. 0.18.0 is already on latest (promoted 2026-09-30), so it
          # waits for nothing else. Held for all eight. While it waits, an
          # agent installed at 0.19.0 by an exact pin reads latest (0.18.0)
          # and stages nothing.
          HELD_FROM_LATEST=""
          DIST_TAG=latest
          for held in $HELD_FROM_LATEST; do
            if [ "$CURRENT" = "$held" ]; then
              DIST_TAG=next
            fi
          done
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.ver.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.ver.outputs.publish == 'true'
        run: npm run build

      - name: Test
        if: steps.ver.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.ver.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.ver.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Held from latest
        if: steps.ver.outputs.publish == 'true' && steps.ver.outputs.dist_tag != 'latest'
        # Every held version is held for its OWN reason, so nothing printed
        # here for every version names one version's backend, and the promote
        # command comes last, after the condition that gates it
        # (test/publish-workflow.spec.ts reads what this step prints).
        run: |
          VERSION="${{ steps.ver.outputs.current }}"
          TAG="${{ steps.ver.outputs.dist_tag }}"
          echo "::warning::$VERSION was published under the npm dist tag $TAG, not latest, so nothing installs it by default. Promote it only when the reason it is held is met: that reason is written beside $VERSION in the HELD_FROM_LATEST comment in this workflow and in the promote block of the README."
          if [ "$VERSION" = "0.14.0" ]; then
            echo "::warning::0.14.0 needs no backend of its own. It is promoted only after 0.13.0 is on latest, never before or in the same step, and only after one logged in live image turn confirms the real item (result bytes and their form, the result size (under 12 MiB, the line cap), revisedPrompt, savedPath, the failure shape; probe.md, decision 7)."
            echo "::warning::npm points latest at whichever version was promoted last: promoting an older version after 0.14.0 moves latest back to that older version."
          fi
          if [ "$VERSION" = "0.15.0" ]; then
            echo "::warning::0.15.0 needs no backend of its own. It is promoted only after 0.14.0 is on latest, never before or in the same step. Until then the HOAI app keeps Send now on a Codex agent a plain send, because it steers only daemons at 0.15.0 or later."
            echo "::warning::npm points latest at whichever version was promoted last: promoting an older version after 0.15.0 moves latest back to that older version."
          fi
          if [ "$VERSION" = "0.18.0" ]; then
            echo "::warning::0.18.0 needs no backend of its own. It is promoted only after 0.15.0 is on latest, never before or in the same step. Until then no Codex agent offers the model and effort row, because the HOAI app offers it only to a daemon that declares session_model_control."
            echo "::warning::npm points latest at whichever version was promoted last: promoting an older version after 0.18.0 moves latest back to that older version."
          fi
          if [ "$VERSION" = "0.19.0" ]; then
            echo "::warning::0.19.0 waits for its own reason only (0.18.0 is already on latest): promote it once the backend judges Codex pairings by their own version, not the Claude Code plugin's pin, and the app keeps Codex agents out of the one click update, which sends update_rpc that Codex does not answer."
          fi
          echo "Only once that reason is met, remove $VERSION from HELD_FROM_LATEST"
          echo "in this workflow and its HELD-FROM-LATEST line in src/interactions.ts,"
          echo "then promote the already published package by hand:"
          echo "  npm dist-tag add codex-channel-bgos@$VERSION latest"

      - name: Tag release
        if: steps.ver.outputs.publish == 'true' && github.event_name == 'push'
        run: |
          VERSION="${{ steps.ver.outputs.current }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
